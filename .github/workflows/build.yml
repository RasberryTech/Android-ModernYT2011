name: Build ModernYT2011

on:
  workflow_dispatch:
  push:
    branches:
      - modernyt2011-build-setup

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare extracted project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main
          mkdir -p app/src/main/java
          cp -R sources/. app/src/main/java/
          cp -R resources/res app/src/main/
          cp resources/AndroidManifest.xml app/src/main/
          if [ -d resources/assets ]; then
            cp -R resources/assets app/src/main/
          fi

          # The decompiler produced a class named R that also contains generated
          # resource constants. Android Gradle generates the real public R class,
          # so keep the legacy Runnable under a different name in the build copy.
          if [ -f app/src/main/java/com/google/android/youtube/R.java ]; then
            mv app/src/main/java/com/google/android/youtube/R.java app/src/main/java/com/google/android/youtube/LegacyR.java
            sed -i 's/final class R implements Runnable/final class LegacyR implements Runnable/' app/src/main/java/com/google/android/youtube/LegacyR.java
            sed -i 's/\bR(/LegacyR(/g; s/\bR\s\+\([A-Za-z_$][A-Za-z0-9_$]*\)/LegacyR \1/g' app/src/main/java/com/google/android/youtube/LegacyR.java app/src/main/java/com/google/android/youtube/*.java
          fi

          # Decompiled legacy 9-patch files can lose their Android chunk metadata.
          # Keep their pixels and resource names, but compile them as ordinary PNGs
          # so AAPT2 can consume them without redesigning the UI.
          find app/src/main/res -type f -name '*.9.png' -print0 | while IFS= read -r -d '' f; do
            mv "$f" "${f%.9.png}.png"
          done

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK and DEX
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ModernYT2011-debug
          path: app/build/outputs/apk/debug/*.apk
