name: Build ModernYT2011

on:
  workflow_dispatch:
  push:
    branches:
      - modernyt2011-build-setup

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract decompiled project
        shell: bash
        run: |
          rm -rf app/src/main
          mkdir -p app/src/main
          unzip -q YT2011_decompiled.zip -d /tmp/yt2011
          ROOT="/tmp/yt2011/YT2011_decompiled"
          cp -R "$ROOT/sources/." app/src/main/java/
          cp -R "$ROOT/resources/res" app/src/main/
          cp "$ROOT/resources/AndroidManifest.xml" app/src/main/
          if [ -d "$ROOT/resources/assets" ]; then
            cp -R "$ROOT/resources/assets" app/src/main/
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK and DEX
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModernYT2011-debug
          path: app/build/outputs/apk/debug/*.apk
